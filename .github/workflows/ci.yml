name: Continuous Integration

on:
  push:
    branches:
      - master
    tags-ignore:
      - "**"
  pull_request:
    branches:
      - master

jobs:
  testing:
    runs-on: ubuntu-latest
    env:
      CI: true
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: better_auth_test
      MYSQL_USER: better_auth
      MYSQL_PASSWORD: better_auth
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: better_auth_test
      POSTGRES_USER: better_auth
      POSTGRES_PASSWORD: better_auth
    services:
      mysql:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: better_auth_test
          MARIADB_USER: better_auth
          MARIADB_PASSWORD: better_auth
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: better_auth_test
          POSTGRES_USER: better_auth
          POSTGRES_PASSWORD: better_auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U better_auth -d better_auth_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Build
        run: pnpm run build
      - name: Test
        run: pnpm run test
